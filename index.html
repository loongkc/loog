<script id="loog-format">
(function(root){
'use strict';
const MAGIC=[0x4C,0x4F,0x4F,0x47,0x7E,0xA5,0x19,0x01],VER=1,HEAD=86,CH=1024,ITER=250000;
const te=new TextEncoder(),td=new TextDecoder();
function cyrb(b,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<b.length;i++){const c=b[i];h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return[h2>>>0,h1>>>0];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function concat(...p){let n=0;p.forEach(x=>n+=x.length);const o=new Uint8Array(n);let k=0;p.forEach(x=>{o.set(x,k);k+=x.length;});return o;}
function sboxFor(salt){const r=mulberry(cyrb(salt,7)[0]);const s=Array.from({length:256},(_,i)=>i);for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[s[i],s[j]]=[s[j],s[i]];}const inv=new Array(256);s.forEach((v,i)=>inv[v]=i);return{s,inv};}
function mask(data,salt,idx,sb,decode){const r=mulberry((cyrb(salt,idx+13)[1]^Math.imul(idx+1,2654435761))>>>0);const out=new Uint8Array(data.length);for(let i=0;i<data.length;i++){const k=(r()*256)|0;out[i]=decode?((sb.inv[data[i]]-k)&255):sb.s[(data[i]+k)&255];}return out;}
function order(n,salt){const r=mulberry(cyrb(salt,99)[0]);const o=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;}
async function derive(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
function need(){if(!(root.crypto&&root.crypto.subtle))throw new Error('当前环境不支持 Web Crypto，请使用现代浏览器并通过 https 或本地文件打开');}
async function seal(obj,pw){
  need();
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const head=new Uint8Array(HEAD);head.set(MAGIC,0);head[8]=VER;head[9]=0;head.set(salt,10);head.set(iv,26);
  const key=await derive(pw,salt);
  const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:head.slice(0,38)},key,te.encode(JSON.stringify(obj))));
  const n=Math.ceil(cipher.length/CH),sb=sboxFor(salt),ord=order(n,salt),frames=[];
  let total=0;
  for(const i of ord){const raw=cipher.subarray(i*CH,Math.min(cipher.length,(i+1)*CH));const m=mask(raw,salt,i,sb,false);const f=new Uint8Array(6+m.length);const dv=new DataView(f.buffer);dv.setUint32(0,i);dv.setUint16(4,m.length);f.set(m,6);frames.push(f);total+=f.length;}
  const body=concat(...frames);
  const hd=new DataView(head.buffer);hd.setUint32(38,n);hd.setUint32(42,cipher.length);
  const [a,b]=cyrb(concat(head.subarray(0,46),body),0x10091);hd.setUint32(46,a);hd.setUint32(50,b);
  head.set(new Uint8Array(await crypto.subtle.digest('SHA-256',concat(head.subarray(0,54),body))),54);
  return concat(head,body);
}
async function open(buf,pw){
  need();
  const u=new Uint8Array(buf),bad=()=>new Error('不是有效的 .loog 文件，或文件已损坏');
  if(u.length<HEAD+6)throw bad();
  for(let i=0;i<8;i++)if(u[i]!==MAGIC[i])throw bad();
  if(u[8]!==VER)throw new Error('不支持的 .loog 版本');
  const dv=new DataView(u.buffer,u.byteOffset,u.byteLength);
  const n=dv.getUint32(38),clen=dv.getUint32(42);
  if(n!==Math.ceil(clen/CH)||n>(1<<20))throw bad();
  const body=u.subarray(HEAD);
  const [a,b]=cyrb(concat(u.subarray(0,46),body),0x10091);
  if(a!==dv.getUint32(46)||b!==dv.getUint32(50))throw bad();
  const h2=new Uint8Array(await crypto.subtle.digest('SHA-256',concat(u.subarray(0,54),body)));
  for(let i=0;i<32;i++)if(h2[i]!==u[54+i])throw bad();
  const salt=u.slice(10,26),iv=u.slice(26,38),sb=sboxFor(salt),bv=new DataView(body.buffer,body.byteOffset,body.byteLength);
  const chunks=new Array(n);let pos=0;
  while(pos<body.length){if(pos+6>body.length)throw bad();const idx=bv.getUint32(pos),len=bv.getUint16(pos+4);if(idx>=n||chunks[idx]||pos+6+len>body.length)throw bad();chunks[idx]=mask(body.subarray(pos+6,pos+6+len),salt,idx,sb,true);pos+=6+len;}
  for(let i=0;i<n;i++)if(!chunks[i])throw bad();
  const cipher=concat(...chunks);if(cipher.length!==clen)throw bad();
  let plain;
  try{const key=await derive(pw,salt);plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:u.slice(0,38)},key,cipher);}
  catch(e){throw new Error('密码错误，或文件内容已被篡改');}
  try{return JSON.parse(td.decode(plain));}catch(e){throw bad();}
}
root.LoogFormat={seal,open,cyrb,mulberry,MAGIC};
})(typeof window!=='undefined'?window:globalThis);
</script>

function stats() {

}

const HITOKOTO_TTL = 6 * 3600 * 1000;
const HK_TYPES = ['d', 'i', 'e', 'k'];
const HK_TYPE_NAMES = { a:'动画', b:'漫画', c:'游戏', d:'文学', e:'原创', f:'网络', g:'其他', h:'影视', i:'诗词', j:'网易云', k:'哲学', l:'抖机灵' };
const HK_TYPE_DESC = HK_TYPES.map(t => `${t}=${HK_TYPE_NAMES[t]}`).join(' · ');

async function loadHitokoto(force = false) {
  const now = Date.now();
  if (!force && S.hitokoto.text && (now - S.hitokoto.fetchedAt) < HITOKOTO_TTL) return S.hitokoto;
  const mode = S.hitokotoMode;
  if (mode === 'online') {
    try {
      const cParams = HK_TYPES.map(t => 'c=' + t).join('&');
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3500);
      const res = await fetch(`https://v1.hitokoto.cn/?encode=json&${cParams}`, { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        if (data && data.hitokoto) {
          S.hitokoto = { text: data.hitokoto, from: data.from || '', uuid: data.uuid || '', fetchedAt: now, source: 'online' };
          saveJ(K.hitokoto, S.hitokoto); return S.hitokoto;
        }
      }
    } catch (e) { console.warn('一言 API 获取失败，尝试回退', e); }
  }
  if (mode === 'bundle' || (mode === 'online' && !S.hitokoto.text)) {
    const shuffled = [...HK_TYPES].sort(() => Math.random() - 0.5);
    for (const type of shuffled) {
      try {
        const res = await fetch(`https://cdn.jsdelivr.net/gh/hitokoto-osc/sentences-bundle@master/sentences/${type}.json`);
        if (res.ok) {
          const list = await res.json();
          if (Array.isArray(list) && list.length) {
            const item = list[Math.floor(Math.random() * list.length)];
            S.hitokoto = { text: item.hitokoto, from: item.from || '', uuid: item.uuid || '', fetchedAt: now, source: 'bundle' };
            saveJ(K.hitokoto, S.hitokoto); return S.hitokoto;
          }
        }
      } catch (e) { console.warn(`语句库分类 ${type} 加载失败`, e); }
    }
  }
  if (mode === 'local' || !S.hitokoto.text) {
    const idx = Math.floor(Math.random() * QUOTES.length);
    S.hitokoto = { text: QUOTES[idx], from: '', uuid: '', fetchedAt: now, source: 'local' };
    saveJ(K.hitokoto, S.hitokoto);
  }
  return S.hitokoto;
}
let quoteTypeTimer;
function typeQuote(hk) {
  const textEl = $('#dailyQuoteText'), fromEl = $('#dailyQuoteFrom');
  if (!textEl) return;
  clearInterval(quoteTypeTimer);
  textEl.textContent = '';
  textEl.classList.add('type-caret');
  if (fromEl) { fromEl.textContent = ''; fromEl.style.opacity = '0'; }
  const text = hk.text || '';
  let i = 0;
  quoteTypeTimer = setInterval(() => {
    i++;
    textEl.textContent = '“' + text.slice(0, i) + (i < text.length ? '' : '”');
    if (i >= text.length) {
      clearInterval(quoteTypeTimer);
      setTimeout(() => textEl.classList.remove('type-caret'), 1200);
      if (fromEl && hk.from) {
        fromEl.textContent = '—— ' + hk.from;
        setTimeout(() => fromEl.style.opacity = '1', 100);
      }
    }
  }, 65);
}
function attachQuote() {
  const hk = S.hitokoto;
  if (!hk || !hk.text) { toast('还没有好句可以附加'); return; }

}

/* ★ 应用皮肤：先清空所有内联变量，再按 k 决定是否应用 custom，保证切换干净 */
function applySkin(k) {
  const root = document.documentElement;
  SKIN_VARS.forEach(([key]) => root.style.removeProperty('--' + key));
  if (k === 'custom') {
    if (!S.customSkin || !Object.keys(S.customSkin).length) S.customSkin = getDefaultCustom();
    Object.entries(S.customSkin).forEach(([key, v]) => root.style.setProperty('--' + key, hexToSpace(v)));
  }
  root.dataset.skin = k;
  S.skin = k;
  saveJ(K.set, { skin: k, custom: S.customSkin });
}

    case 'focus': enterFocus(); break;
    case 'save': saveEntry(); break;
    case 'discard': if (await confirmDlg('放弃编辑？', '本次对这篇日记的未保存修改会被丢弃，原日记不受影响。', '放弃')) { resetEditor(); toast('已放弃编辑'); } break;
    case 'tag-filter': S.filter.tag = S.filter.tag === a.dataset.t ? '' : a.dataset.t; renderList(); break;
    case 'clear-filter': S.filter = { q: '', date: '', tag: '' }; renderList(); break;
    case 'hm-mode': S.heat = a.dataset.m; renderStats(); break;
    case 'hm-prev': case 'hm-next': { const k = act === 'hm-prev' ? -1 : 1; if (S.heat === 'year') S.year += k; else { S.month += k; if (S.month < 0) { S.month = 11; S.year--; } if (S.month > 11) { S.month = 0; S.year++; } } renderStats(); break; }
    case 'hm-day': S.filter = { q: '', date: a.dataset.d, tag: '' }; go('list'); break;
    case 'skin': applySkin(a.dataset.k); renderSettings(); break;
    case 'skin-custom': customSkinModal(); break;
    case 'hk-mode': {
      S.hitokotoMode = a.dataset.m;
      ls.set(K.hkmode, S.hitokotoMode);
      if (S.hitokotoMode !== 'local') {
        S.hitokoto = { text: '', from: '', uuid: '', fetchedAt: 0, source: 'local' };
        loadHitokoto().then(hk => typeQuote(hk));
      } else { S.quote = 0; }
      renderSettings();
      toast('每日一句来源已更新');
      break;
    }
    case 'export-txt': exportTxt(); break;
    case 'export-loog': exportLoog(); break;
    case 'export-delta': exportDelta(); break;
    case 'release-space': releaseModal('（请确认合并后的 .loog 已保存）'); break;
    case 'import-loog': $('#impFile').click(); break;
    case 'trash-restore': if (Engine.restoreTrash(id)) { toast('已恢复 🌿'); renderSettings(); } else toast('该条目已损坏，无法恢复'); break;
    case 'trash-purge': if (await confirmDlg('彻底删除？', '删除后无法再找回。', '彻底删除', true)) { Engine.purgeTrash(id); renderSettings(); } break;
    case 'trash-empty': if (await confirmDlg('清空回收站？', '所有已删除的日记将无法再找回。', '清空', true)) { Engine.trash = {}; saveJ(K.trash, Engine.trash); renderSettings(); } break;
    case 'scan-all': {
      const box = $('#scanResult'); if (!box) break;
      box.innerHTML = '<div class="mt-3 sub">⏳ 正在逐篇校验「头 / 内容 / 校验尾」…</div>';
      setTimeout(() => {
        const r = Engine.scanAll();
        Engine.damaged = r.bad.slice();
        renderScanResult(r);
        toast(r.bad.length ? `检出 ${r.bad.length} 篇异常` : '全部校验通过 ✓');
      }, 180);
      break;
    }
    case 'fix-entry': {
      if (Engine.tryRepair(id)) { toast('已从历史记录修复 ✓'); if (cur === 'settings') renderSettings(); }
      else toast('没有可用的历史记录，请清理', 'rose');
      break;
    }
    case 'clean-entry': {
      if (await confirmDlg('清理损坏条目？', '该条目无法读取，清理后将从本地删除。', '清理', true)) {
        Engine.cleanOne(id); toast('已清理'); if (cur === 'settings') renderSettings();
      }
      break;
    }
    case 'clean-damaged': Engine.cleanDamaged(); renderSettings(); toast('已清理'); break;
    case 'restore-version': {
      if (Engine.restoreVersion(id, +a.dataset.t)) {
        toast('已恢复到所选版本 🕘');
        renderVersionList(id);
        if (cur === 'list' || cur === 'home') render[cur]();
      } else toast('恢复失败', 'rose');
      break;
    }
    case 'wipe': if (await confirmDlg('清空全部本地数据？', '所有日记、草稿、回收站与历史版本都会被删除。建议先导出 .loog 备份。', '全部清空', true)) { try { Object.keys(localStorage).filter(k => k.startsWith('loog:') && k !== K.seed).forEach(k => localStorage.removeItem(k)); } catch {} Engine.entries.clear(); Engine.ids = []; Engine.ops = []; Engine.trash = {}; Engine.damaged = []; S.todos = []; S.stickers = []; S.customSkin = null; D = newDraft(); toast('已清空'); go(cur); } break;
  }
});
function addTodo() { const i = $('#todoInput'); const v = i.value.trim().slice(0, 120); if (!v) return; S.todos.unshift({ id: uid(), text: v, done: false }); saveJ(K.todos, S.todos); i.value = ''; renderTodo(); i.focus(); }
document.addEventListener('keydown', e => {
  if (e.target.id === 'todoInput' && e.key === 'Enter') { e.preventDefault(); addTodo(); return; }
  if (e.key === 'Escape') { if (modals.length) modals[modals.length - 1].close(); else if (document.body.classList.contains('focus-mode')) exitFocus(); else closePops && cur === 'write' && closePops(); }
});
$('#exitFocus').addEventListener('click', exitFocus);
$('#impFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importLoog(f); });
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (p && p !== cur) go(p); });
window.addEventListener('beforeunload', () => { if (cur === 'write') flushDraft(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && cur === 'write') flushDraft(); });
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('loog:e:')) { } });

render.home = renderHome; render.list = renderList; render.stats = renderStats; render.settings = renderSettings;

/* ---------- 启动 ---------- */
(function boot() {
  const set = loadJ(K.set, {});
  if (set.custom && typeof set.custom === 'object') {
    const restored = {};
    SKIN_VARS.forEach(([k, _, d]) => {
      const v = set.custom[k];
      restored[k] = (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) ? v : d;
    });
    S.customSkin = restored;
  }
  if (set.skin === 'custom') {
    if (!S.customSkin) S.customSkin = getDefaultCustom();
    applySkin('custom');
  } else if (SKINS.some(s => s[0] === set.skin)) {
    applySkin(set.skin);
  }
  const hk = loadJ(K.hitokoto, null);
  if (hk && typeof hk.text === 'string' && hk.text) S.hitokoto = { ...S.hitokoto, ...hk };
  const hkMode = ls.get(K.hkmode);
  if (['online','bundle','local'].includes(hkMode)) S.hitokotoMode = hkMode;
  Engine.init();
  S.todos = loadJ(K.todos, []).filter(t => t && typeof t.id === 'string' && typeof t.text === 'string');
  S.stickers = loadJ(K.stk, []).filter(s => typeof s === 'string' && IMG_RE.test(s));
  const dr = loadJ(K.draft, null);
  if (dr && typeof dr === 'object') {
    D = { ...newDraft(),
      editingId: typeof dr.editingId === 'string' ? dr.editingId : null,
      date: /^\d{4}-\d{2}-\d{2}$/.test(dr.date) ? dr.date : ymd(new Date()),
      title: String(dr.title || '').slice(0, 100),
      html: sanitize(dr.html || ''),
      weather: WMAP[dr.weather] ? dr.weather : '',
      mood: MMAP[dr.mood] ? dr.mood : '',
      tags: Array.isArray(dr.tags) ? dr.tags.filter(t => typeof t === 'string').slice(0, 8) : [],
      quote: normQuote(dr.quote)
    };
  }
  buildNav(); buildWrite();
  go(location.hash.slice(1) || 'home');
  loadHitokoto();
  if (Engine.repaired) setTimeout(() => toast(`已从历史记录自动修复 ${Engine.repaired} 篇受损日记 🛠️`), 800);
})();
})();
</script>
</body>
